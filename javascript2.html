<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replit</title>
</head>

<body>
    <script>
        let oddOrEven = function (number) {
            if (number % 2 == 0) {
                document.write(number + "is an even number");
            }
        }
        let number = prompt("enter the number");
        oddOrEven(number);
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body style="text-align: center;">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">


<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

</script> 
<div class="jumbotron jumbotron fluid">
    <div class="container">
    <h1 style="color: rgb(218, 166, 218);">
        codingal
    </h1>
    <p>Codingal will help you fall in love with coding</p>
</div> 
</div>
<div class="container mt-3">
    <h2>buttons</h2>
    <button type="button" class="btn btn-primary">Primary</button>
    <button type="button" class="btn btn-secondary">Secondary</button>
    <button type="button" class="btn btn-success">Success</button>
    <button type="button" class="btn btn-danger">Danger</button>
    <button type="button" class="btn btn-warning">Warning</button>
</div>
<div class="container">

    <h2>Carousel Example</h2>

    <div id="mycarousel" class="carousel slide" data-ride="carousel">

        <!-- Indicators -->

        <ol class="carousel-indicators">

            <li data-target="#mycarousel" data-slide-to="0" class="active"></li>

            <li data-target="#mycarousel" data-slide-to="1"></li>

            <li data-target="#mycarousel" data-slide-to="2"></li>

            <li data-target="#mycarousel" data-slide-to="3"></li>

        </ol>

        <!-- Wrapper for slides -->

        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSOT60807JhRhKokMQTXHy6E2xm2DPP_DcrbA&s"
                    alt="image 1" class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="https://images.stockcake.com/public/8/e/f/8ef7ec15-2307-40b1-b21d-99f62ceb70db_large/penguin-on-ice-stockcake.jpg"
                    alt="image 2" class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMe6npUdQJvCNTh6eHNy58slZKzwjc1IRk1g&s"
                    alt="image 3" class="d-block w-100">

            </div>

            <div class="carousel-item">

                <img src="https://wwfgifts-files.worldwildlife.org/wwfgifts/images/emperor-penguin-landing-photo.jpg"
                    alt="image 4" class="d-block w-100">

            </div>

        </div>

        <!-- Left and right controls -->

        <a class="carousel-control-prev" href="#mycarousel" role="button" data-slide="prev">

            <span class="carousel-control-prev-icon" aria-hidden="true"></span>

            <span class="sr-only">Previous</span>

        </a>

        <a class="carousel-control-next" href="#mycarousel" role="button" data-slide="next">

            <span class="carousel-control-next-icon" aria-hidden="true"></span>

            <span class="sr-only">Next</span>

        </a>

    </div>

</div>
</body>
</html>
